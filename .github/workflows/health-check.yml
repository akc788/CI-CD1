name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application health
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://ci-cd1-ofhn.onrender.com/health
          max-attempts: 3
          retry-delay: 5s




          